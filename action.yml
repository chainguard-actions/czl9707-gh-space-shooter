name: 'GitHub Space Shooter'
description: 'Transform your GitHub contribution graph into an space shooter game GIF'
author: 'zane'
branding:
  icon: 'navigation-2'
  color: 'black'
inputs:
  github-token:
    description: 'GitHub token for fetching contribution data (usually secrets.GITHUB_TOKEN)'
    required: true
  username:
    description: 'GitHub username to generate game for (defaults to repository owner)'
    required: false
    default: ${{ github.repository_owner }}
  output-path:
    description: 'Path where the GIF should be saved'
    required: false
    default: 'gh-space-shooter.gif'
  strategy:
    description: 'Enemy attack strategy (column, row, or random)'
    required: false
    default: 'random'
  fps:
    description: 'Frames per second for the animation (default: 40)'
    required: false
    default: '40'
  commit-message:
    description: 'Commit message for the GIF update'
    required: false
    default: 'Update space shooter game GIF'
outputs:
  gif-path:
    description: 'Path to the generated GIF file'
    value: ${{ steps.generate.outputs.gif-path }}
runs:
  using: 'composite'
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - name: Install gh-space-shooter
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install gh-space-shooter
    - name: Generate game GIF
      id: generate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        USERNAME: ${{ inputs.username }}
        OUTPUT_PATH: ${{ inputs.output-path }}
        STRATEGY: ${{ inputs.strategy }}
        FPS: ${{ inputs.fps }}
      run: |
        gh-space-shooter "$USERNAME" \
          --output "$OUTPUT_PATH" \
          --strategy "$STRATEGY" \
          --fps "$FPS"
    - name: Commit and push GIF
      shell: bash
      env:
        OUTPUT_PATH: ${{ inputs.output-path }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add "$OUTPUT_PATH"
        git diff --staged --quiet || git commit -m "$COMMIT_MESSAGE"
        git push

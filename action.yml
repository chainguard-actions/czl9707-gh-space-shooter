name: 'GitHub Space Shooter'
description: 'Transform your GitHub contribution graph into a space shooter game GIF'
author: 'zane'
branding:
  icon: 'navigation-2'
  color: 'black'
inputs:
  github-token:
    description: 'GitHub token for fetching contribution data (usually secrets.GITHUB_TOKEN)'
    required: true
  username:
    description: 'GitHub username to generate game for (defaults to repository owner)'
    required: false
    default: ${{ github.repository_owner }}
  output-path:
    description: 'Path where the GIF should be saved'
    required: false
    default: 'gh-space-shooter.gif'
  strategy:
    description: 'Enemy attack strategy (column, row, or random)'
    required: false
    default: 'random'
  fps:
    description: 'Frames per second for the animation (default: 40)'
    required: false
    default: '40'
  no-amend:
    description: 'Disable amending previous commits (always create new commits)'
    required: false
    default: 'false'
  commit-message:
    description: 'Commit message for the GIF update'
    required: false
    default: 'Update space shooter game GIF'
outputs:
  output-file:
    description: 'Path to the generated output file (GIF or WebP)'
    value: ${{ steps.generate.outputs.output-file }}
runs:
  using: 'composite'
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - name: Install gh-space-shooter
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install gh-space-shooter
    - name: Generate game
      id: generate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_OUTPUT_PATH: ${{ inputs.output-path }}
        INPUT_STRATEGY: ${{ inputs.strategy }}
        INPUT_FPS: ${{ inputs.fps }}
      run: |
        gh-space-shooter "$INPUT_USERNAME" \
          --output "$INPUT_OUTPUT_PATH" \
          --strategy "$INPUT_STRATEGY" \
          --fps "$INPUT_FPS"
        safe_output_path=$(printf '%s' "$INPUT_OUTPUT_PATH" | tr -d '\n\r')
        echo "output-file=$safe_output_path" >> "$GITHUB_OUTPUT"
    - name: Commit and push
      shell: bash
      env:
        INPUT_OUTPUT_PATH: ${{ inputs.output-path }}
        INPUT_COMMIT_MSG: ${{ inputs.commit-message }}
        INPUT_NO_AMEND: ${{ inputs.no-amend }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        OUTPUT_PATH="$INPUT_OUTPUT_PATH"
        COMMIT_MSG="$INPUT_COMMIT_MSG"
        NO_AMEND="$INPUT_NO_AMEND"

        git add "$OUTPUT_PATH"

        SHOULD_AMEND="false"
        if [ "$NO_AMEND" != "true" ]; then
          LAST_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "")
          LAST_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD 2>/dev/null | grep -v '^$' || echo "")

          if [ "$LAST_MSG" = "$COMMIT_MSG" ] && [ "$LAST_FILES" = "$OUTPUT_PATH" ]; then
            SHOULD_AMEND="true"
          fi
        fi

        if [ "$SHOULD_AMEND" = "true" ]; then
          echo "Amending previous commit (same message and file)"
          git commit --amend --no-edit
          git push --force-with-lease
        else
          echo "Creating new commit"
          git diff --staged --quiet || git commit -m "$COMMIT_MSG"
          git push
        fi

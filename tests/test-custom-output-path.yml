name: Test custom output path and column strategy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Inject fake gh_space_shooter module via PYTHONPATH
        run: |
          mkdir -p /tmp/fake-pkg/gh_space_shooter
          touch /tmp/fake-pkg/gh_space_shooter/__init__.py
          printf '%s\n' \
            'import sys' \
            '' \
            'def app():' \
            '    args = sys.argv[1:]' \
            '    out = None' \
            '    for i, arg in enumerate(args):' \
            '        if arg in ("--output", "-out", "-o") and i + 1 < len(args):' \
            '            out = args[i + 1]' \
            '    if out:' \
            '        open(out, "wb").close()' \
            '        print(f"Fake gh-space-shooter: created {out}")' \
            '    return None' \
            > /tmp/fake-pkg/gh_space_shooter/cli.py
          echo "PYTHONPATH=/tmp/fake-pkg" >> "$GITHUB_ENV"

      - name: Set up local git remote so push succeeds
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
          git push --set-upstream origin act-harness

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          username: ${{ github.repository_owner }}
          output-path: 'custom-shooter.gif'
          strategy: 'column'
          fps: '10'
          no-amend: 'true'
          commit-message: 'Test: custom output path'

      - name: Assert output-file matches custom path
        env:
          ACTUAL: ${{ steps.action.outputs.output-file }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "custom-shooter.gif" ]; then
            echo "FAIL: expected 'custom-shooter.gif' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: output-file matches custom path"

      - name: Assert custom GIF file exists
        run: |
          if [ ! -f "custom-shooter.gif" ]; then
            echo "FAIL: expected custom GIF file not found at custom-shooter.gif"
            exit 1
          fi
          echo "PASS: custom GIF file exists"

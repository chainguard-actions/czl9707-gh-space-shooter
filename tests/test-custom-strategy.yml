name: Test custom strategy and fps
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          username: 'czl9707'
          output-path: 'shooter-column.gif'
          strategy: 'column'
          fps: '30'

      - name: Assert GIF was generated with column strategy or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GIF_PATH: ${{ steps.action.outputs.gif-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gif-path output: $GIF_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -f "shooter-column.gif" ]; then
              echo "FAIL: action succeeded but GIF file not found at shooter-column.gif"
              exit 1
            fi
            echo "PASS: GIF file exists at shooter-column.gif"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -f "shooter-column.gif" ]; then
              echo "PASS: GIF was generated before push failed (expected in harness)"
            else
              echo "PASS: action failed gracefully (API or push failure in harness)"
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

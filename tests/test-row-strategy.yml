name: Test row strategy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up local git remote so push succeeds
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
          git push -u origin act-harness
          git config push.default current

      - name: Inject fake gh_space_shooter via PYTHONPATH
        run: |
          # The gh-space-shooter console script calls:
          #   from gh_space_shooter.cli import app; app()
          # Setting PYTHONPATH to our fixture dir makes Python find our fake
          # package first, regardless of which Python/pip environment is used.
          echo "PYTHONPATH=$GITHUB_WORKSPACE/tests/fixtures" >> "$GITHUB_ENV"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          username: ${{ github.repository_owner }}
          output-path: 'row-strategy.gif'
          strategy: 'row'
          fps: '30'
          no-amend: 'true'
          commit-message: 'Test: row strategy GIF'

      - name: Assert output-file is set
        env:
          ACTUAL: ${{ steps.action.outputs.output-file }}
        run: |
          echo "actual output-file: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: output-file output is empty"
            exit 1
          fi
          echo "PASS: output-file is set to '$ACTUAL'"

      - name: Assert GIF file exists
        env:
          OUTPUT_FILE: ${{ steps.action.outputs.output-file }}
        run: |
          echo "Checking for file: $OUTPUT_FILE"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "FAIL: expected GIF file '$OUTPUT_FILE' does not exist"
            exit 1
          fi
          echo "PASS: GIF file exists at '$OUTPUT_FILE'"

      - name: Assert output-file matches expected path
        env:
          ACTUAL: ${{ steps.action.outputs.output-file }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "row-strategy.gif" ]; then
            echo "FAIL: expected 'row-strategy.gif' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: output-file matches expected path"

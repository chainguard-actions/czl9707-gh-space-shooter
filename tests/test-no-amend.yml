name: Test no-amend flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create output directory
        run: mkdir -p tests/output

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          username: octocat
          output-path: tests/output/no-amend-test.gif
          no-amend: 'true'
          commit-message: 'chore: update space shooter GIF'
        continue-on-error: true

      - name: Assert output-file path is correct when set
        env:
          ACTUAL: ${{ steps.action.outputs.output-file }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "actual output-file: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$ACTUAL" != "tests/output/no-amend-test.gif" ]; then
              echo "FAIL: expected 'tests/output/no-amend-test.gif', got '$ACTUAL'"
              exit 1
            fi
            echo "PASS: output-file=$ACTUAL"
          else
            echo "INFO: action did not succeed (expected in act environment without real token)"
            echo "PASS: skipping output assertion due to expected API failure"
          fi

name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          username: 'octocat'
          output-path: 'test-output/gh-space-shooter.gif'
          strategy: 'random'
          fps: '10'
          commit-message: 'Test: Update space shooter GIF'

      - name: Assert gif-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.gif-path }}
        run: |
          echo "actual gif-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: gif-path output is empty"
            exit 1
          fi
          echo "PASS: gif-path output is set to '$ACTUAL'"

      - name: Assert GIF file exists
        run: |
          GIF_FILE="test-output/gh-space-shooter.gif"
          echo "Checking for GIF at: $GIF_FILE"
          if [ ! -f "$GIF_FILE" ]; then
            echo "FAIL: GIF file not found at $GIF_FILE"
            exit 1
          fi
          echo "PASS: GIF file exists"

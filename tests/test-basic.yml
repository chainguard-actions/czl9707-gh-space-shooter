name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          username: octocat
          output-path: test-output.gif
          strategy: random
          fps: '10'
          no-amend: 'true'
          commit-message: 'Test: Update space shooter game GIF'
        continue-on-error: true

      - name: Assert output-file is set
        env:
          OUTPUT_FILE: ${{ steps.action.outputs.output-file }}
        run: |
          echo "output-file: $OUTPUT_FILE"
          if [ -z "$OUTPUT_FILE" ]; then
            echo "FAIL: output-file output was not set"
            exit 1
          fi
          if [ "$OUTPUT_FILE" != "test-output.gif" ]; then
            echo "FAIL: expected output-file to be 'test-output.gif', got '$OUTPUT_FILE'"
            exit 1
          fi
          echo "PASS: output-file=$OUTPUT_FILE"
